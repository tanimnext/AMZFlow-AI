name: Release portable desktop apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (for example 7.1.0)"
        required: true
        type: string
      platforms:
        description: "Native platforms to build"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - both
          - macos
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - name: Select native runners
        id: matrix
        shell: bash
        run: |
          case "${{ inputs.platforms }}" in
            windows) os='["windows-latest"]' ;;
            macos) os='["macos-14"]' ;;
            *) os='["windows-latest","macos-14"]' ;;
          esac
          echo "os=${os}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_version="${{ inputs.version }}"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${release_version}" >> "$GITHUB_OUTPUT"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install -r requirements-build.txt
      - name: Build portable ZIP
        run: >-
          python scripts/build_dist.py
          --version "${{ steps.version.outputs.value }}"
          --github-repository "${{ github.repository }}"
          --license-api-url "${{ vars.LICENSE_API_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release
          merge-multiple: true
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_version="${{ inputs.version }}"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${release_version}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.version.outputs.value }}" release/*
          --target "${{ github.sha }}"
          --title "AmzFlow AI v${{ steps.version.outputs.value }}"
          --generate-notes
