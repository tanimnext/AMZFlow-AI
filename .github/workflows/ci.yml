name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web_app/requirements_web.txt
      - run: python -m pip install -r web_app/requirements_web.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall app_files web_app scripts desktop_main.py desktop_updater.py
